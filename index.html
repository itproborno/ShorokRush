<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShorokRush</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f1ff;--mut:#d3cdf5;--pink:#ff3d81;--org:#ff9f1c;--cy:#2de2e6;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;color:var(--ink);font-family:Outfit,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:grid;place-items:center}
.bg{position:fixed;inset:0;background:linear-gradient(120deg,#0b0820,#2a1060 45%,#7a1459 75%,#ff7a2f);background-size:220% 220%;animation:bgm 14s ease infinite}
@keyframes bgm{50%{background-position:100% 100%}}
@media(prefers-reduced-motion:reduce){.bg{animation:none}}
.side{position:absolute;top:50%;transform:translateY(-50%);width:clamp(190px,calc((100vw - min(100vw,56.25dvh))/2 - 36px),340px);display:none;flex-direction:column;align-items:center;gap:16px}
.side.l{left:18px}.side.r{right:18px}
@media(min-width:900px){.side{display:flex}}
.pho{width:130px;height:130px;border-radius:50%;border:5px solid #fff;object-fit:cover;box-shadow:0 0 30px rgba(255,61,129,.6)}.ibl{width:130px;border-radius:24px;box-shadow:0 0 30px rgba(45,140,255,.6)}
.adbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.adbox b{font:400 21px/1.1 Bungee,Impact,sans-serif;color:#fff;text-shadow:0 2px 0 var(--pink)}.adbox small{color:var(--mut);font-size:13px}
.side .adbox b{font-size:27px}.side .pill{font-size:26px}.side .ic img{width:50px;height:50px}.side small{font-size:16px}
.pill{display:flex;align-items:center;gap:8px;background:#fff;color:#202124;font:700 20px Outfit,sans-serif;padding:9px 18px;border-radius:30px;border:3px solid #4285f4;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.pill svg{width:22px;height:22px;stroke:#4285f4;fill:none;stroke-width:3;stroke-linecap:round}
.ic{display:flex;gap:8px}.ic img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid #fff}
#ph{position:relative;height:100vh;height:100dvh;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);overflow:hidden;background:#000;box-shadow:0 0 70px rgba(255,61,129,.4)}
#gl,#cp{position:absolute;inset:0;display:block}#cp{pointer-events:none}
#flash{position:absolute;inset:0;background:#ff1f3d;opacity:0;pointer-events:none;z-index:3}
.panel{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:max(4vh,env(safe-area-inset-top)) 7% max(4vh,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,8,32,.8),rgba(11,8,32,.96));overflow:hidden;align-items:center}
.panel[hidden],#hud[hidden],#ctl[hidden]{display:none}
h1{font:400 clamp(26px,8vw,36px)/1.05 Bungee,Impact,sans-serif;margin:0;background:linear-gradient(90deg,var(--org),var(--pink),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--mut);font-size:15px;line-height:1.35}
button,a.cta{font:600 18px Outfit,sans-serif;padding:13px;border:0;border-radius:12px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--org));cursor:pointer;text-align:center;text-decoration:none;display:block}
button.alt{background:#2a2160}a.cta{background:linear-gradient(90deg,#4285f4,#2de2e6)}button:focus-visible,a:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.big{font:400 44px Bungee,Impact,sans-serif;color:var(--org)}
.logo{width:68%;max-width:250px;align-self:center}
.set{display:grid;gap:8px;background:rgba(255,255,255,.08);padding:10px;border-radius:12px}.set button{padding:9px;font-size:14px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mut)}input[type=range]{width:58%;accent-color:var(--pink)}
#hud{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;font:400 16px Bungee,Impact,sans-serif;text-shadow:0 2px 6px #000;pointer-events:none}
#hud small{display:block;font:600 12px Outfit,sans-serif;color:#fff}#lv{color:var(--pink);letter-spacing:2px}
.mid{display:flex;gap:8px;align-self:flex-start}
.hb{pointer-events:auto;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(20,14,50,.7);border:2px solid rgba(255,255,255,.4);font-size:18px;color:#fff}.hb svg{width:20px;height:20px;fill:#fff}
#ctl{position:absolute;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}
.grp{display:flex;gap:12px}
.cb{pointer-events:auto;touch-action:none;width:70px;height:70px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,14,50,.5);color:#fff;font:700 26px Outfit,sans-serif;display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#cb{width:96px;border-radius:36px;font-size:15px;background:rgba(225,29,46,.55)}.cb.on{background:rgba(255,61,129,.85)}
.dif{display:flex;gap:8px}.dif button{flex:1;padding:13px 4px;font-size:18px;background:#2a2160;border:2px solid transparent}.dif button.on{background:linear-gradient(90deg,var(--pink),var(--org));border-color:#fff}
.go{font-size:26px;padding:17px;letter-spacing:1px;box-shadow:0 0 24px rgba(255,61,129,.6)}.bestw{text-align:center}.bestw span{font:600 14px Outfit,sans-serif;letter-spacing:3px;color:var(--mut)}
details.stg summary{cursor:pointer;font:600 17px Outfit,sans-serif;color:#fff;padding:11px;background:rgba(255,255,255,.12);border-radius:12px;text-align:center;list-style:none}details.stg summary::-webkit-details-marker{display:none}details.stg[open] summary{margin-bottom:8px}details.stg p{margin-top:8px}
#toast{position:absolute;z-index:5;left:50%;top:22%;transform:translate(-50%,0);font:400 22px Bungee,Impact,sans-serif;color:#ffe45c;text-shadow:0 2px 8px #000,0 0 14px #ff3d81;opacity:0;pointer-events:none;white-space:nowrap}
.in{display:flex;flex-direction:column;gap:11px;width:100%}.row{display:flex;gap:6px}.row button{flex:1;padding:8px;font-size:12px}.cb[hidden]{display:none}
#ph.brk::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,rgba(255,40,60,.4),transparent);z-index:2;pointer-events:none}
</style></head><body>
<div class="bg"><div class="side l"><img class="pho" data-k="me" alt=""><div class="adbox"></div></div><div class="side r"><img class="ibl" data-k="ib" alt=""><div class="adbox"></div></div></div>
<div id="ph">
<canvas id="gl"></canvas><canvas id="cp"></canvas><div id="flash"></div><div id="toast"></div>
<div id="hud" hidden><div><span id="lv"></span><small id="km"></small></div><div class="mid"><button id="mb" class="hb" aria-label="Toggle music">♪</button><button id="pb" class="hb" aria-label="Pause game"></button></div><div style="text-align:right"><span id="sc">0</span><small id="hi"></small></div></div>
<div id="ctl" hidden><div class="grp"><button id="cl" class="cb" aria-label="Steer left">◀</button><button id="cr" class="cb" aria-label="Steer right">▶</button></div><button id="cb" class="cb" aria-label="Brake">BRAKE</button></div>

<section class="panel" id="menu"><div class="in"><img class="logo" data-k="logo" alt="ShorokRush"><div class="bestw"><span>BEST SCORE</span><div class="big" id="mh">0</div></div><div class="dif"><button data-d="0">EASY</button><button data-d="1">MEDIUM</button><button data-d="2">HARD</button></div><button id="bs" class="go">▶ START RIDE</button><details class="stg"><summary>⚙ Sound, tilt and help</summary><div class="set"></div><p>Tilt your phone like a handlebar to steer (or hold ◀ ▶) and hold BRAKE to slow down. Keyboard: ← → or A D, S or ↓ to brake, P to pause.</p></details><div class="adbox"></div></div></section>
<section class="panel" id="pause" hidden><div class="in"><h1>Paused</h1><div><p>Current score</p><div class="big" id="ps">0</div></div><button id="br">Resume</button><button class="alt" id="brs">Restart</button><button class="alt" id="bq">Quit to menu</button><div class="set"></div></div></section>
<section class="panel" id="over" hidden><div class="in"><h1>You crashed out!</h1><div><p>Score</p><div class="big" id="os">0</div></div><p id="on"></p><button id="ba">Ride again</button><button id="sh" class="alt">Share score on WhatsApp</button><a class="cta" href="https://www.google.com/search?q=itproborno" target="_blank" rel="noopener">🔍 Google “itproborno”</a><button class="alt" id="bm">Menu</button><div class="adbox"></div></div></section>
</div>
